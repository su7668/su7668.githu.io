function xb(s,k){var o="";for(var i=0;i<s.length;i++){o+=String.fromCharCode(s.charCodeAt(i)^k[i%k.length]);}return o;}
function kf(sd,ac){var k=[];for(var i=0;i<256;i++){k.push(((sd.charCodeAt(i%sd.length)+i*7)&255)^ac.charCodeAt(i%ac.length));}return k;}
function d64(s){return atob(s);}
function b2s(b){var u=new Uint8Array(b.length);for(var i=0;i<b.length;i++){u[i]=b.charCodeAt(i)&255;}return new TextDecoder().decode(u);}
function seed(){return xb(d64(S),K1);}
function anchor(){return d64(A);}
function expHash(){return d64(H);}
function key(){return kf(seed(),anchor());}
function payload(){return b2s(xb(d64(P),key()));}
function hsh(s){var h=5381;for(var i=0;i<s.length;i++){h=((h*33)^s.charCodeAt(i))>>>0;}return h.toString(16);}
function ok(){return hsh(P+"|"+S+"|"+A)===expHash();}
function off(){var a=anchor().split("-");var t=new Date(+a[0],+a[1]-1,+a[2]).getTime();return Math.floor((Date.now()-t)/86400000);}
function today(){var d=new Date(),p=function(n){return n<10?"0"+n:""+n;};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}

function ld(k){try{localStorage.removeItem(k);}catch(e){}}

function contact(){return frag(M1,K2)+frag(M2,K3);}
